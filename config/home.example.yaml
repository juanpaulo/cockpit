# Home Assistant entities grouped by card type.
cards:
  - type: solar
    entities:
      - sensor.example_solar_power
      - sensor.example_solar_energy_today
  - type: locks
    entities:
      - lock.example
  - type: climate
    entities:
      - climate.example
  - type: garage
    entities:
      - cover.example

# Entities the app may act on via POST /api/actions — the allowlist.
# Anything not listed here is rejected with 403; `confirm: true` gives the
# action a two-tap confirm in the UI.
controls:
  - entity: lock.example
    actions: [lock, unlock]
    confirm: true
  - entity: switch.example_light
    actions: [toggle]
